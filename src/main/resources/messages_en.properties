# ── About ──────────────────────────────────────────
about.hero.eyebrow=El F\u00e9nix Bakery \u2014 New Jersey
about.hero.title=Our Story
about.hero.subtitle=From Havana to New Jersey, Cuban soul intact
about.s1.eyebrow=Our Origins
about.s1.title=The Origin of
about.s1.titleEm=F\u00e9nix
about.s1.p1=Years later, two Cuban cousins decided to bet everything on keeping that Cuban Flavor alive \u2014 expanding it, reinventing it, and perfecting it for the Latino and American communities of the Garden State.
about.s1.p2=With hard work and heart, and with the certainty that success was within reach, they have managed to preserve and grow the reputation the bakery had already earned. Fenix Bakery now has three locations in three different cities, all on the same Bergenline Avenue.
about.s2.eyebrow=Our Philosophy
about.s2.title=Like the
about.s2.titleEm=Fenix
about.s2.p1=The name is no coincidence. Like the mythological bird that rises from its ashes, El F\u00e9nix Bakery represents the rebirth of a culinary tradition that traveled 90 miles north without losing an ounce of its essence.
about.s2.p2=Today we are a team of 8 people, almost all of Cuban origin, and we still use the same recipes from day one. No shortcuts: sourdough, slow fermentation, fresh ingredients and lots of love.
about.team.eyebrow=Who We Are
about.team.title=The
about.team.titleEm=Team
about.carmen.role=Founder \u00b7 Master Pastry Chef
about.carmen.desc=Specialist in traditional Cuban sweets. Her flans and custards are legendary.
about.roberto.role=Founder \u00b7 Master Baker
about.roberto.desc=20 years baking Cuban bread. Nobody in New Jersey makes toast like him.
about.yolanda.role=Pastry Chef \u00b7 Cakes & Tortes
about.yolanda.desc=She turns every celebration into a sweet memory. Her tres leches are unmissable.

