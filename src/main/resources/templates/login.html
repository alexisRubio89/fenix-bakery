<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Acceso Admin | Fénix Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
    <style>
        :root { --gold:#c9a84c; --gold-lt:#e4c97e; --black:#080808; --dark:#111; --dark2:#181818; --border:rgba(201,168,76,.2); --muted:rgba(255,255,255,.45); }
        body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--black); font-family:'Inter',sans-serif; }
        body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(201,168,76,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.03) 1px,transparent 1px); background-size:60px 60px; pointer-events:none; }
        .login-wrap { width:100%; max-width:420px; padding:1.5rem; position:relative; z-index:1; }
        .login-card { background:var(--dark2); border:1px solid var(--border); padding:3rem; }
        .login-header { text-align:center; margin-bottom:2.5rem; }
        .login-logo { font-size:3rem; margin-bottom:1rem; }
        .login-header h1 { font-family:'Cormorant Garamond',serif; font-size:2rem; color:var(--gold); font-weight:400; margin-bottom:.25rem; }
        .login-header p { color:var(--muted); font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; }
        .gold-line { width:40px; height:1px; background:var(--gold); margin:.75rem auto 0; opacity:.5; }
        .alert { padding:.8rem 1rem; margin-bottom:1.5rem; font-size:.85rem; border-left:3px solid; }
        .alert-danger { background:rgba(192,24,42,.1); color:#f87171; border-color:#c0182a; }
        .alert-success { background:rgba(201,168,76,.1); color:var(--gold); border-color:var(--gold); }
        .form-group { margin-bottom:1.25rem; }
        .form-label { display:block; font-size:.7rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.6rem; }
        .form-control { width:100%; padding:.85rem 1rem; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); color:#fff; font-family:'Inter',sans-serif; font-size:.9rem; outline:none; transition:border-color .25s; }
        .form-control:focus { border-color:var(--gold); }
        .btn-login { width:100%; padding:.9rem; background:var(--gold); color:var(--black); font-family:'Inter',sans-serif; font-size:.75rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; border:none; cursor:pointer; margin-top:.5rem; transition:background .25s,transform .2s; }
        .btn-login:hover { background:var(--gold-lt); transform:translateY(-1px); }
        .hint { margin-top:1.5rem; padding:1rem; background:rgba(201,168,76,.06); border:1px solid rgba(201,168,76,.15); font-size:.78rem; color:var(--muted); text-align:center; line-height:1.6; }
        .hint code { color:var(--gold); background:rgba(201,168,76,.1); padding:.1rem .4rem; }
        .back-link { display:block; text-align:center; margin-top:1.5rem; color:var(--muted); font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; transition:color .2s; }
        .back-link:hover { color:var(--gold); }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-header">
            <img src="/img/logo.png" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 1rem;display:block;" alt="El Fénix Bakery"/>
            <h1>Fénix Bakery</h1>
            <p>Panel Administrativo</p>
            <div class="gold-line"></div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            Sesión cerrada correctamente.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>
    </div>
    <a th:href="@{/}" class="back-link">← Volver al sitio</a>
</div>
</body>
</html>
