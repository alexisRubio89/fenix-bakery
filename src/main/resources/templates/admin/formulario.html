<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${accion} + ' producto | Admin'">Producto | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body class="admin-body">

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-brand"><img src="/img/logo.png" style="width:34px;height:34px;border-radius:50%;object-fit:cover;"> <span>El Fénix Bakery</span></div>
    <nav class="sidebar-nav">
        <a th:href="@{/admin/dashboard}" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
        <a th:href="@{/admin/menu}" class="nav-item"><span class="nav-icon">🍽️</span> Menú</a>
        <a th:href="@{/admin/cakes}" class="nav-item"><span class="nav-icon">🎂</span> Cakes</a>
        <a th:href="@{/admin/fiestas}" class="nav-item"><span class="nav-icon">🎉</span> Fiestas</a>
        <a th:href="@{/admin/inventario}" class="nav-item active"><span class="nav-icon">📦</span> Inventario</a>
        <a th:href="@{/admin/mensajes}" class="nav-item"><span class="nav-icon">✉️</span> Mensajes <span th:if="${sidebarNoLeidos > 0}" class="nav-badge" th:text="${sidebarNoLeidos}">0</span></a>
        <a th:href="@{/}" class="nav-item"><span class="nav-icon">🌐</span> Ver sitio</a>
    </nav>
    <div class="sidebar-footer">
        <span sec:authentication="name">Usuario</span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="logout-btn">Salir</button>
        </form>
    </div>
</aside>

<main class="admin-main">
    <div class="admin-header">
        <div>
            <h1 th:text="${accion} + ' producto'">Producto</h1>
            <p>Completa los datos del producto</p>
        </div>
        <a th:href="@{/admin/inventario}" class="btn btn-outline">← Volver al inventario</a>
    </div>

    <div class="form-card">
        <form th:action="@{/admin/inventario/guardar}" th:object="${producto}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Nombre del producto *</label>
                    <input type="text" th:field="*{nombre}" class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                           placeholder="Ej. Harina de trigo"/>
                    <div th:if="${#fields.hasErrors('nombre')}" class="form-error" th:errors="*{nombre}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Categoría *</label>
                    <select th:field="*{categoria}" class="form-control"
                            th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                        <option value="">Selecciona una categoría…</option>
                        <option value="Ingredientes">Ingredientes</option>
                        <option value="Pan">Pan</option>
                        <option value="Panadería fina">Panadería fina</option>
                        <option value="Postres">Postres</option>
                        <option value="Empaques">Empaques</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <div th:if="${#fields.hasErrors('categoria')}" class="form-error" th:errors="*{categoria}"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Cantidad en almacén *</label>
                    <input type="number" th:field="*{cantidad}" class="form-control"
                           th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid'"
                           placeholder="0" min="0"/>
                    <div th:if="${#fields.hasErrors('cantidad')}" class="form-error" th:errors="*{cantidad}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Precio unitario ($) *</label>
                    <input type="number" th:field="*{precio}" class="form-control"
                           th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'"
                           placeholder="0.00" step="0.01" min="0"/>
                    <div th:if="${#fields.hasErrors('precio')}" class="form-error" th:errors="*{precio}"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Descripción</label>
                <textarea th:field="*{descripcion}" class="form-control" rows="3"
                          placeholder="Descripción breve del producto…"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"
                        th:text="${accion} + ' producto'">Guardar</button>
                <a th:href="@{/admin/inventario}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
