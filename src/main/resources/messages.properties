# ── Nosotros ───────────────────────────────────────
about.hero.eyebrow=El F\u00e9nix Bakery \u2014 New Jersey
about.hero.title=Nuestra Historia
about.hero.subtitle=De La Habana a New Jersey, con el alma cubana intacta
about.s1.eyebrow=Nuestros or\u00edgenes
about.s1.title=El origen de El
about.s1.titleEm=F\u00e9nix
about.s1.p1=F\u00e9nix Bakery naci\u00f3 en 2005 cuando Carmen y Roberto Villalba, una pareja habanera radicada en New Jersey, decidieron abrir las puertas de su obrador con una misi\u00f3n clara: traer el sabor aut\u00e9ntico de la panader\u00eda y dulcer\u00eda cubana a la di\u00e1spora.
about.s1.p2=Carmen aprendi\u00f3 el oficio de su madre en La Habana Vieja. Roberto domin\u00f3 el arte del pan cubano trabajando en una panader\u00eda de Miramar durante 15 a\u00f1os. Juntos trajeron esas manos y esas recetas a New Jersey, y el barrio los adopt\u00f3 desde el primer d\u00eda.
about.s2.eyebrow=Nuestra filosof\u00eda
about.s2.title=Como el ave
about.s2.titleEm=F\u00e9nix
about.s2.p1=El nombre no es casualidad. Como el ave mitol\u00f3gica que renace de sus cenizas, F\u00e9nix Bakery representa el renacer de una tradici\u00f3n culinaria que viaj\u00f3 90 millas al norte sin perder una pizca de su esencia.
about.s2.p2=Hoy somos un equipo de 8 personas, casi todas de origen cubano, y seguimos usando las mismas recetas del primer d\u00eda. Nada de atajos: masa madre, fermentaci\u00f3n lenta, ingredientes frescos y mucho amor.
about.team.eyebrow=Qui\u00e9nes somos
about.team.title=El
about.team.titleEm=equipo
about.carmen.role=Fundadora \u00b7 Maestra dulcera
about.carmen.desc=Especialista en dulcer\u00eda cubana tradicional. Sus flanes y natillas son leyenda.
about.roberto.role=Fundador \u00b7 Maestro panadero
about.roberto.desc=20 a\u00f1os horneando pan cubano. Nadie en New Jersey hace la tostada como \u00e9l.
about.yolanda.role=Pastelera \u00b7 Tortas y cakes
about.yolanda.desc=Convierte cada celebraci\u00f3n en un recuerdo dulce. Sus tres leches son imperdibles.

